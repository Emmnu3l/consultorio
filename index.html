<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Completo NANDA-NIC</title>
    <style>
        :root {
            --primary-color: #0d9488;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h2 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 16px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 16px;
            border-left: 5px solid var(--primary-color);
        }

        .card h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #0f172a;
        }

        .badge {
            display: inline-block;
            background-color: #ccfbf1;
            color: #0f766e;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .section-title {
            font-weight: bold;
            font-size: 0.9rem;
            color: #475569;
            margin-top: 8px;
            display: block;
        }

        ul {
            margin: 4px 0 12px 0;
            padding-left: 20px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Asistente NANDA-NIC (Catálogo Completo)</h2>
        <input type="text" id="searchInput" class="search-box" placeholder="Buscar por código, etiqueta o dominio..." onkeyup="renderDiagnoses()">

        <!-- Contenedor dinámico donde se cargarán todos los diagnósticos -->
        <div id="diagnosesContainer"></div>
    </div>

    <script>
        // Aquí puedes integrar masivamente la información completa extraída de tus PDFs
        const catalogoDiagnosticos = [
            {
                codigo: "00032",
                etiqueta: "Patrón respiratorio ineficaz",
                dominio: "Dominio 4: Actividad/Reposo",
                definicion: "Inspiración y/o espiración que no proporciona una ventilación adecuada.",
                relacionados: ["Fatiga de los músculos respiratorios", "Ansiedad", "Dolor"],
                caracteristicas: ["Disnea", "Taquipnea", "Uso de músculos accesorios"]
            },
            {
                codigo: "00132",
                etiqueta: "Dolor agudo",
                dominio: "Dominio 12: Confort",
                definicion: "Experiencia sensorial y emocional desagradable ocasionada por una lesión tisular real o potencial.",
                relacionados: ["Agentes lesivos (biológicos, físicos, químicos)"],
                caracteristicas: ["Expresión facial de dolor", "Alteración de los parámetros hemodinámicos"]
            },
            {
                codigo: "00004",
                etiqueta: "Riesgo de infección",
                dominio: "Dominio 11: Seguridad/Protección",
                definicion: "Susceptible a la invasión y multiplicación de organismos patógenos, que puede comprometer la salud.",
                relacionados: ["Procedimientos invasivos", "Defensas secundarias inadecuadas"],
                caracteristicas: ["Diagnóstico de riesgo (no presenta características definitorias previas)"]
            }
            // Puedes seguir agregando todos los objetos que necesites aquí...
        ];

        function renderDiagnoses() {
            let filter = document.getElementById('searchInput').value.toLowerCase();
            let container = document.getElementById('diagnosesContainer');
            container.innerHTML = "";

            let resultados = catalogoDiagnosticos.filter(item => 
                item.etiqueta.toLowerCase().includes(filter) || 
                item.codigo.includes(filter) || 
                item.dominio.toLowerCase().includes(filter)
            );

            resultados.forEach(item => {
                let card = document.createElement('div');
                card.className = 'card';

                let relacionadosHTML = item.relacionados.map(r => `<li>${r}</li>`).join('');
                let caracteristicasHTML = item.caracteristicas.map(c => `<li>${c}</li>`).join('');

                card.innerHTML = `
                    <span class="badge">${item.dominio}</span>
                    <h3>${item.codigo} - ${item.etiqueta}</h3>
                    <span class="section-title">Definición:</span>
                    <p style="margin: 4px 0; font-size: 0.95rem;">${item.definicion}</p>
                    
                    <span class="section-title">Factores Relacionados / Riesgo:</span>
                    <ul>${relacionadosHTML}</ul>

                    <span class="section-title">Características Definitorias:</span>
                    <ul>${caracteristicasHTML}</ul>
                `;
                container.appendChild(card);
            });
        }

        // Cargar todos al iniciar la vista
        renderDiagnoses();
    </script>

</body>
</html>
